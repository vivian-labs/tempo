[package]
name = "tempo"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A tactile clock and timing instrument"
rust-version = "1.90"

[lib]
name = "tempo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.18.2"
rtrb = "0.4"
keepawake = "0.6.1"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
panic = "abort"
